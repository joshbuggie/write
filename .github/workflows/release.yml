name: Release

# Push a tag like v1.2.3 to publish ghcr.io/<owner>/<repo>:1.2.3 and :latest for amd64 and arm64.
# CI also calls this after it passes on main, publishing :main and :sha-<short sha>.
on:
  push:
    tags: ["v*"]
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the version without the "v" (1.2.3), plus "latest" for non-prerelease versions.
      # Pushes to main get "main" and "sha-<short sha>" instead, and never move "latest".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
